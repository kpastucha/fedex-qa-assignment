<div class="card">
  <div class="card-body">
    <form [formGroup]="searchForm" (ngSubmit)="search()">
      <div class="row g-2 align-items-center">
        <div class="col-auto">
          <div class="form-check">
            <input formControlName="searchType" class="form-check-input" type="radio" id="people" value="people" />
            <label class="form-check-label" for="people"> People </label>
          </div>
        </div>
        <div class="col-auto">
          <div class="form-check">
            <input formControlName="searchType" class="form-check-input" type="radio" id="planets" value="planets" />
            <label class="form-check-label" for="planets"> Planets </label>
          </div>
        </div>
        <div class="col-auto">
          <label class="visually-hidden" for="query">Query</label>
          <input formControlName="query" type="search" class="form-control" id="query" />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">Search</button>
        </div>
      </div>
    </form>
  </div>
</div>
